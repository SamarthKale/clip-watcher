# Copy to config.toml and adjust. Every key is optional; defaults live in clipwatcher/config.py.
# The channel can also be given on the command line:  python -m clipwatcher run --channel NAME

channel = ""                 # Twitch login or URL, e.g. "somestreamer" or "https://twitch.tv/somestreamer"
streamer_display_name = ""   # used in credits; defaults to the channel login

[paths]
data_dir = "data"            # recordings/, chat/, raw_clips/, jobs/, shorts/, logs/ live under here

[record]                     # STEP 1 - streamlink
quality = "best"             # e.g. "best", "1080p60", "720p60", "720p"
retry_streams = 30           # seconds between live checks while the channel is offline
retry_open = 3
extra_args = []              # e.g. ["--twitch-api-header", "Authorization=OAuth <browser auth-token>"]

[chat]                       # STEP 2 - Twitch IRC, read-only
server = "irc.chat.twitch.tv"
port = 6697                  # 6697 = TLS (recommended); 6667 with tls = false
tls = true
# Used only if Twitch refuses anonymous (justinfan) access. Your own account; token needs chat:read.
username = ""
oauth_token = ""             # or set the TWITCH_OAUTH_TOKEN environment variable

[detect]                     # STEP 3 - spike detection (original 3x rolling-average algorithm)
bucket_seconds = 10
window_seconds = 300
threshold = 3.0
min_history_seconds = 300
min_baseline = 1.0
min_spike_messages = 8
cooldown_seconds = 90
max_run_buckets = 6
gap_seconds = 20
merge_window_seconds = 45    # a spike from another detector this close = the same moment (one clip)

[detect.audio]               # STEP 3b (optional) - loudness spikes in the recording. Off by default:
enabled = false              # the chat detector above stays the default trigger.
rise_lu = 12.0               # spike = this many LU above the previous 5 minutes (12 ~ a scream)
floor_lufs = -24.0           # ...and at least this loud
window_seconds = 300
min_history_seconds = 120
min_seconds = 2              # sustained this long (filters single gunshots / ability sounds)
cooldown_seconds = 90
chunk_seconds = 30           # scan the recording 30 s at a time, ~40 s behind live

[sync]
chat_offset_seconds = 0.0    # shift chat time onto the video timeline if you measure a drift

[extract]                    # STEP 4 - raw footage
pre_seconds = 60
post_seconds = 60
safety_seconds = 10
frames_every_seconds = 10
frame_width = 640
chat_context_seconds = 60
signals = true               # signals.json: loudness peaks, silences, scene cuts, chat emote categories
scene_detect = true

[transcribe]                 # STEP 5 - whisper.cpp
enabled = true
whisper_cli = "whisper-cli"
model = "models/ggml-medium.en.bin"
language = "en"
threads = 4

[edit]                       # STEP 6 - Claude Code
mode = "claude"              # "claude" = automatic headless edits, "manual" = run /edit-short yourself
max_turns = 80
timeout_seconds = 3600
max_short_seconds = 60       # hard limit for a Short
target_short_seconds = 50    # aim for about this length when the footage supports it (0 = no preference)
render_all = false           # true = a Short from every spike whatever its score (highest triage score first)

[export]                     # written by `finish` into <Short>/final/ - nothing is ever uploaded
enabled = true
platforms = ["youtube_shorts", "tiktok", "instagram_reels"]
thumbnail = true             # thumbnail.jpg 1280x720 + cover.jpg 1080x1920
# [export.specs.instagram_reels]   # override any platform limit, e.g.
# max_seconds = 90

[queue]
max_attempts = 4
lease_seconds = 900
