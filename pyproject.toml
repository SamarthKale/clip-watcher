[project]
name = "clipwatcher"
version = "0.1.0"
description = "Twitch chat-spike clip pipeline with Claude Code as the editor"
requires-python = ">=3.11"
dependencies = []  # stdlib only; external tools: streamlink, ffmpeg, whisper.cpp, Claude Code

[project.optional-dependencies]
record = ["streamlink>=6.0"]

[project.scripts]
clipwatcher = "clipwatcher.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clipwatcher"]

[tool.setuptools.package-data]
clipwatcher = ["ui_static/*.html"]
